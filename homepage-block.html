<!-- ============================================================
     DPP HOMEPAGE · Community Events Calendar block
     Paste into a Code Block on the homepage (Display Source off).
     The "Coming up" flyers update on their own from GitHub.
     ============================================================ -->

<div id="dpp-teaser" class="dppt">
  <div class="dppt-copy">
    <img class="dppt-icon" src="https://diasporapeoplesplace.github.io/dpp-events/icon-flower.png" alt="" aria-hidden="true">
    <h2 class="dppt-title">Community Events Calendar</h2>
    <p class="dppt-desc">Collective liberation runs on the ties between us. Show up for each other's poetry nights and potlucks, spend with our makers and vendors, and we stay organized, funded and in it for the long haul.</p>
    <a class="dppt-cta" href="/events">See what's happening</a>
  </div>
  <div class="dppt-upcoming" aria-label="Coming up">
    <p class="dppt-label">Coming up</p>
    <div class="dppt-grid" id="dppt-grid"></div>
  </div>
</div>

<style>
  #dpp-teaser{
    --dppt-bg:#272727; --dppt-text:#efebe1; --dppt-green:#60e33f; --dppt-line:rgba(239,235,225,.14);
    background:var(--dppt-bg); color:var(--dppt-text);
    max-width:1200px; margin:0 auto; padding:56px 48px;
    display:grid; grid-template-columns:1fr 1.2fr; gap:48px; align-items:start; }
  #dpp-teaser *{ box-sizing:border-box; }
  #dpp-teaser .dppt-icon{ display:block; height:84px; width:auto; margin:0 0 20px; }
  #dpp-teaser .dppt-title{ margin:0 0 14px; color:var(--dppt-text); line-height:1.05; }
  #dpp-teaser .dppt-desc{ margin:0 0 26px; color:var(--dppt-text); line-height:1.6; max-width:480px; opacity:.9; }
  #dpp-teaser .dppt-cta{ display:inline-block; padding:22px 64px; border-radius:999px; background:#8cfc4d;
    color:#111 !important; text-decoration:none !important; font-family:var(--heading-font-font-family, inherit);
    font-weight:700; font-size:28px; line-height:1.1; letter-spacing:-.01em; }
  #dpp-teaser .dppt-cta:hover{ background:#a3ff6e; }
  @media (max-width:560px){ #dpp-teaser .dppt-cta{ padding:18px 40px; font-size:22px; } }
  #dpp-teaser .dppt-label{ text-transform:uppercase; letter-spacing:.14em; font-size:12px; margin:6px 0 14px; color:var(--dppt-green); }
  #dpp-teaser .dppt-grid{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
  #dpp-teaser .dppt-tile{ display:block; text-decoration:none !important; color:var(--dppt-text) !important; }
  #dpp-teaser .dppt-art{ display:block; aspect-ratio:4/5; border-radius:8px; overflow:hidden; background:#1e1e1e; border:1px solid var(--dppt-line); }
  #dpp-teaser .dppt-art img{ width:100%; height:100%; object-fit:contain; display:block; transition:transform .25s ease; }
  #dpp-teaser .dppt-tile:hover .dppt-art img{ transform:scale(1.03); }
  #dpp-teaser .dppt-when{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; margin:9px 0 2px; color:var(--dppt-green); }
  #dpp-teaser .dppt-name{ font-size:13px; line-height:1.3; margin:0; color:var(--dppt-text); }
  @media (max-width:900px){
    #dpp-teaser{ grid-template-columns:1fr; gap:32px; padding:40px 24px; }
  }
  @media (max-width:560px){
    #dpp-teaser .dppt-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); }
    #dpp-teaser .dppt-icon{ height:64px; }
  }
</style>

<script>
(function () {
  var BASE = "https://diasporapeoplesplace.github.io/dpp-events/";
  var SHOW = 4;
  var grid = document.getElementById("dppt-grid");
  if (!grid) return;
  try {
    var t = document.querySelector("#dpp-teaser .dppt-title"), c = document.querySelector("#dpp-teaser .dppt-cta");
    if (t && c) c.style.fontFamily = getComputedStyle(t).fontFamily;
  } catch (e) {}
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  function parseDate(s) { var m = String(s || "").match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function minutes(t) { var m = String(t || "").match(/^(\d{1,2})(?::(\d{2}))?\s*([AaPp])/); if (!m) return 9999;
    return (+m[1] % 12 + (/[Pp]/.test(m[3]) ? 12 : 0)) * 60 + (+m[2] || 0); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  var now = new Date(); var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  fetch(BASE + "events.json?v=" + Math.floor(Date.now() / 600000))
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (list) {
      var seen = {};
      var up = list.map(function (e) { e.d = parseDate(e.date); e.dEnd = parseDate(e.until) || e.d; return e; })
        .filter(function (e) { return e.d && e.dEnd >= today && e.flyer; })
        .sort(function (a, b) { return a.d - b.d || minutes(a.start) - minutes(b.start); })
        .filter(function (e) { if (seen[e.flyer]) return false; seen[e.flyer] = 1; return true; })
        .slice(0, SHOW);
      if (!up.length) { grid.parentNode.style.display = "none"; return; }
      grid.innerHTML = up.map(function (e) {
        var when = DAYS[e.d.getDay()] + ", " + MONTHS[e.d.getMonth()] + " " + e.d.getDate();
        return '<a class="dppt-tile" href="/events">' +
          '<span class="dppt-art"><img src="' + esc(BASE + "flyers/" + e.flyer) + '" alt="Flyer for ' + esc(e.name) + '" loading="lazy"></span>' +
          '<p class="dppt-when">' + esc(when) + "</p>" +
          '<p class="dppt-name">' + esc(e.name) + "</p></a>";
      }).join("");
    })
    .catch(function () { grid.parentNode.style.display = "none"; });
})();
</script>
